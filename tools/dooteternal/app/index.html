<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doot Eternal</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05040a;
    color: #ffd700;
    font: 12px/1.5 ui-monospace, "JetBrains Mono", monospace;
  }
  #view { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed;
    left: 12px;
    bottom: 12px;
    margin: 0;
    white-space: pre;
    text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
    pointer-events: none;
  }
  #lock-hint {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 6px;
    text-align: center;
    background: rgba(5, 4, 10, 0.72);
    letter-spacing: 0.08em;
    pointer-events: none;
  }
  #lock-hint[hidden] { display: none; }
  #lock-hint strong { font-size: 18px; letter-spacing: 0.16em; }
  #lock-hint span { color: #b89a4e; }
  #crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    margin: -1.5px 0 0 -1.5px;
    border-radius: 50%;
    background: #ffd700;
    box-shadow: 0 0 6px rgba(255, 190, 40, 0.9);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="crosshair"></div>
<pre id="hud"></pre>
<div id="lock-hint">
  <strong>CLICK TO PLAY</strong>
  <span>WASD move &middot; mouse look &middot; click fire &middot; R breath &middot; ESC release</span>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
