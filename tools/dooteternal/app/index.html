<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doot Eternal</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05040a;
    color: #ffd700;
    font: 12px/1.5 ui-monospace, "JetBrains Mono", monospace;
  }
  #view { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed;
    left: 12px;
    bottom: 12px;
    margin: 0;
    white-space: pre;
    color: #7d6a3a;
    pointer-events: none;
  }
  #status {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    pointer-events: none;
  }
  .track {
    width: 200px;
    height: 15px;
    border: 1px solid #6d5a24;
    background: rgba(20, 12, 4, 0.65);
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
  }
  #hp-track { width: 150px; border-color: #7a3030; }
  #breath-fill, #hp-fill {
    height: 100%;
    width: 100%;
    transition: width 60ms linear;
  }
  #breath-fill { background: linear-gradient(90deg, #b8791a, #ffd700); }
  #hp-fill { background: linear-gradient(90deg, #7a1f1f, #e04a3a); }
  #status.recharging #breath-fill { background: linear-gradient(90deg, #ffd700, #fff4c0); }
  #status.starved #breath-fill { background: linear-gradient(90deg, #7a2a2a, #c4442c); }
  #weapon-name {
    min-width: 130px;
    letter-spacing: 0.14em;
    text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
  }
  #keys { display: flex; gap: 6px; }
  #keys .key {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
    background: currentColor;
  }
  #damage-flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 55%, rgba(180, 20, 20, 0) 35%, rgba(190, 20, 20, 0.75) 100%);
    opacity: 0;
    transition: opacity 260ms ease-out;
    pointer-events: none;
  }
  #banner {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    text-align: center;
    letter-spacing: 0.18em;
    font-size: 20px;
    text-shadow: 0 0 14px rgba(255, 170, 0, 0.6);
    pointer-events: none;
  }
  #banner[hidden] { display: none; }
  #lock-hint {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 6px;
    text-align: center;
    background: rgba(5, 4, 10, 0.72);
    letter-spacing: 0.08em;
    pointer-events: none;
  }
  #lock-hint[hidden] { display: none; }
  #lock-hint strong { font-size: 18px; letter-spacing: 0.16em; }
  #lock-hint span { color: #b89a4e; }
  #crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    margin: -1.5px 0 0 -1.5px;
    border-radius: 50%;
    background: #ffd700;
    box-shadow: 0 0 6px rgba(255, 190, 40, 0.9);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="crosshair"></div>
<div id="damage-flash"></div>
<div id="banner" hidden></div>
<div id="status">
  <div class="track" id="hp-track"><div id="hp-fill"></div></div>
  <div class="track" id="breath-track"><div id="breath-fill"></div></div>
  <div id="weapon-name">TRUMPET</div>
  <div id="keys"></div>
</div>
<pre id="hud"></pre>
<div id="lock-hint">
  <strong>CLICK TO PLAY</strong>
  <span>WASD move &middot; mouse look &middot; click fire &middot; 1-4 / wheel weapon &middot; R breath &middot; ESC release</span>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
