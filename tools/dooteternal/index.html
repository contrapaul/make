<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doot Eternal</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05040a;
    color: #ffd700;
    font: 12px/1.5 ui-monospace, "JetBrains Mono", monospace;
  }
  #view { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed;
    left: 12px;
    bottom: 12px;
    margin: 0;
    white-space: pre;
    color: #7d6a3a;
    pointer-events: none;
  }
  #status {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    pointer-events: none;
  }
  .track {
    width: 200px;
    height: 15px;
    border: 1px solid #6d5a24;
    background: rgba(20, 12, 4, 0.65);
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
  }
  #hp-track { width: 150px; border-color: #7a3030; }
  #breath-fill, #hp-fill { height: 100%; width: 100%; transition: width 60ms linear; }
  #breath-fill { background: linear-gradient(90deg, #b8791a, #ffd700); }
  #hp-fill { background: linear-gradient(90deg, #7a1f1f, #e04a3a); }
  #status.recharging #breath-fill { background: linear-gradient(90deg, #ffd700, #fff4c0); }
  #status.starved #breath-fill { background: linear-gradient(90deg, #7a2a2a, #c4442c); }
  #weapon-name {
    min-width: 130px;
    letter-spacing: 0.14em;
    text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
  }
  /* An explicit display beats the [hidden] attribute, so restate it. */
  #status[hidden], #keys[hidden] { display: none; }
  #keys { display: flex; gap: 6px; }
  #keys .key {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
    background: currentColor;
  }
  #damage-flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 55%, rgba(180, 20, 20, 0) 35%, rgba(190, 20, 20, 0.75) 100%);
    opacity: 0;
    transition: opacity 260ms ease-out;
    pointer-events: none;
  }
  #banner {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    text-align: center;
    letter-spacing: 0.18em;
    font-size: 20px;
    text-shadow: 0 0 14px rgba(255, 170, 0, 0.6);
    pointer-events: none;
  }
  #banner[hidden] { display: none; }
  #crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    margin: -1.5px 0 0 -1.5px;
    border-radius: 50%;
    background: #ffd700;
    box-shadow: 0 0 6px rgba(255, 190, 40, 0.9);
    pointer-events: none;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 18px;
    text-align: center;
    background: rgba(5, 4, 10, 0.86);
    letter-spacing: 0.08em;
  }
  .screen[hidden] { display: none; }
  .screen h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 0.3em;
    font-weight: 400;
  }
  .screen .hint { color: #8a7434; font-size: 11px; }
  .screen button {
    font: inherit;
    letter-spacing: 0.14em;
    color: #ffd700;
    background: rgba(40, 24, 8, 0.7);
    border: 1px solid #6d5a24;
    padding: 9px 16px;
    cursor: pointer;
  }
  .screen button:hover:not(:disabled) { background: rgba(90, 56, 12, 0.85); }
  .screen button:disabled { color: #5b5240; border-color: #3a3428; cursor: default; }

  #settings {
    display: grid;
    grid-template-columns: auto 160px 52px;
    align-items: center;
    gap: 10px 14px;
    text-align: left;
    color: #c9a94e;
  }
  #settings input[type="range"] { width: 100%; accent-color: #d9a52a; }
  #settings input[type="checkbox"] { accent-color: #d9a52a; }
  #settings .value { color: #8a7434; }
  #pause-buttons { display: flex; gap: 10px; }

  #overworld-nodes { display: grid; gap: 10px; min-width: 340px; }
  #overworld-nodes .node { display: flex; justify-content: space-between; gap: 24px; }
  #overworld-nodes .node.cleared { color: #9a8548; }
  #overworld-nodes .node-state { font-size: 10px; opacity: 0.75; }
</style>
  <script type="module" crossorigin src="/tools/dooteternal/build/index-CSa34_OD.js"></script>
</head>
<body>
<canvas id="view"></canvas>
<div id="crosshair"></div>
<div id="damage-flash"></div>
<div id="banner" hidden></div>
<div id="status">
  <div class="track" id="hp-track"><div id="hp-fill"></div></div>
  <div class="track" id="breath-track"><div id="breath-fill"></div></div>
  <div id="weapon-name">TRUMPET</div>
  <div id="keys"></div>
</div>
<pre id="hud"></pre>

<div class="screen" id="overworld" hidden>
  <h1>DESCENT</h1>
  <div class="hint">music hell, one floor at a time</div>
  <div id="overworld-nodes"></div>
</div>

<div class="screen" id="pause" hidden>
  <h1>PAUSED</h1>
  <div id="settings">
    <label for="set-soundtrack">Soundtrack</label>
    <input type="checkbox" id="set-soundtrack" checked>
    <span class="value"></span>

    <label for="set-sfx">SFX volume</label>
    <input type="range" id="set-sfx" min="0" max="100" step="1" value="80">
    <span class="value" id="set-sfx-value">80%</span>

    <label for="set-sensitivity">Mouse sensitivity</label>
    <input type="range" id="set-sensitivity" min="0.25" max="3" step="0.05" value="1">
    <span class="value" id="set-sensitivity-value">1.00x</span>
  </div>
  <div id="pause-buttons">
    <button id="pause-resume">RESUME</button>
    <button id="pause-restart">RESTART LEVEL</button>
    <button id="pause-map">DESCENT MAP</button>
  </div>
  <div class="hint">WASD move &middot; mouse look &middot; click fire &middot; 1-4 / wheel weapon &middot; R breath &middot; ESC pause</div>
</div>

</body>
</html>
