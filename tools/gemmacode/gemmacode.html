<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gravity Sling</title>
    <style>
        body { margin: 0; background: #0a0e14; color: white; font-family: system-ui, sans-serif; overflow: hidden; }
        canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; cursor: crosshair; }
        #overlay { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); padding: 1rem; border-radius: 12px; pointer-events: none; }
        #controls { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; }
        button { background: #4f46e5; color: white; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: transform 0.1s, filter 0.1s; }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); }
        #nextLevelBtn { display: none; margin-top: 20px; padding: 15px 30px; background: #06b6d4; font-size: 1rem; }
    </style>
</head>
<body>

<div id="overlay">
  <div>Speed: <span id="speed">0</span> km/s</div>
  <div>To Target: <span id="dist">--</span> km</div>
  <div>Force Vectors (mN):
    <ul style="padding-left: 20px; font-size: 0.9rem;"></ul>
  </div>
</div>

<div id="controls">
  <button onclick="resetGame()">Reset</button>
  <button onclick="launchProbe()">Launch</button>
</div>
<div style="position:absolute; bottom:30px; right:30px" id="nextLevelBtn" onclick="nextLevel()">Next Level</div>

<canvas width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('canvas');
 const ctx = canvas.getContext('2d');

 let G = 15; // Gravitational constant for game scale
 let probe = { x: 100, y: 530, vx: 0, vy: 0, mass: 1 };
 let dragStart = null, launchAngle = -45 * Math.PI / 180, launchPower = 20;

 const levels = [
  { planets: [{x: 350, y: 300, m: 3000}], target: {x: 700, y: 450} }, // Level 1: open field
  { planets: [{x: 250, y: 250, m: 2500}, {x: 550, y: 350, m: 2500}], target: {x: 720, y: 480} }, // Level 2: two planets
  { planets: [{x: 200, y: 150, m: 3500}, {x: 400, y: 400, m: 4500}], target: {x: 750, y: 500} } // Level 3: dense
];

 let currentLevelIndex = 0;
 let isLaunched = false;
 let gameOver = false;
 let timeDt = 1.2;

 function init() {
  const lvl = levels[currentLevelIndex];
  probe = { x: 100, y: 530, vx: 0, vy: 0, mass: 1 };
  isLaunched = false;
  gameOver = false;
}

 canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  dragStart = { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
 });

 window.addEventListener('mousemove', e => {
  if (!dragStart || isLaunched) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  launchAngle = Math.atan2(my - 530, mx - 100);
  launchPower = Math.min(40, Math.sqrt((mx-100)**2 + (my-530)**2) / 8);
 });

 window.addEventListener('mouseup', () => { dragStart = null; });

 function launchProbe() {
  if (!isLaunched && !gameOver) {
    probe.vx = Math.cos(launchAngle) * launchPower;
    probe.vy = Math.sin(launchAngle) * launchPower;
    isLaunched = true;
  }
 }

 function resetGame() { init(); }

 function nextLevel() {
  currentLevelIndex = (currentLevelIndex + 1) % levels.length;
  init();
 }

 const forceList = document.getElementById('speed');
 const distSpan = document.getElementById('dist');
 const forceUl = canvas.querySelector('ul');

 function updateStats(forces) {
  const speed = Math.sqrt(probe.vx**2 + probe.vy**2).toFixed(1);
  forceList.textContent = speed;
  const d = Math.hypot(levels[currentLevelIndex].target.x - probe.x, levels[currentLevelIndex].target.y - probe.y).toFixed(0);
  distSpan.textContent = d;

  forceUl.innerHTML = forces.map((f, i) => `<li>Planet ${i+1}: ${Math.round(f)}</li>`).join('');
 }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const lvl = levels[currentLevelIndex];

  // Draw pad and target
  ctx.fillStyle = '#475569'; ctx.fillRect(80, 520, 40, 10); // Pad
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(100, 530); ctx.lineTo(100 + Math.cos(launchAngle)*launchPower*10, 530+Math.sin(launchAngle)*launchPower*10); ctx.stroke();

  ctx.fillStyle = '#22d3ee'; ctx.beginPath(); ctx.arc(lvl.target.x, lvl.target.y, 18, 0, Math.PI*2); ctx.fill(); // Target
  ctx.strokeStyle = 'white'; ctx.stroke();

  if (!isLaunched && !gameOver) {
    // Trajectory projection (educational preview)
    let px = probe.x, py = probe.y, pvx = Math.cos(launchAngle)*launchPower, pvy = Math.sin(launchAngle)*launchPower;
    ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.moveTo(px, py);
    for (let i=0; i<400; i++) {
      forces = lvl.planets.map(p => G * probe.mass * p.m / Math.pow(Math.hypot(px-p.x, py-p.y), 2)); // reused for visual vector lines in the loop below
      updateStats(forces);

      lvl.planets.forEach((p, j) => {
        const f = G * probe.mass * p.m / Math.pow(Math.hypot(px-p.x, py-p.y), 2);
        const dx = (p.x - px)/Math.hypot(px-p.x,py-p.y) || 0;
        const dy = (p.y - py)/Math.hypot(px-p.x,py-p.y) || 0;
        pvx += f * dx * timeDt / probe.mass; pvy += f * dy * timeDt / probe.mass;
      });

    }

      forces.push(f);

      // Draw planet and force vector
      ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(p.x, p.y, Math.sqrt(p.m)/3 + 5, 0, Math.PI*2); ctx.fill();
      const dx = (p.x - probe.x)/Math.hypot(probe.x-p.x,py-p.y) || 0; // reusing py from the projection loop block but it's fine if this is a static frame helper
      // Recompute forces for stats so they stay accurate in live sim
    });

    lvl.planets.forEach((p, i) => {
       const f = G * probe.mass * p.m / Math.pow(Math.hypot(probe.x-p.x, probe.y-p.y), 2); // this block is inside the render loop so forces array isn't updating the DOM via updateStats unless we re-call it
    });

    });

  });
