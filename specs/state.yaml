  decisions:
    reader: a student using the site alone, no teacher in the room
    location: tools/languages/ (own sub-site, static, no deps)
    demo_depth: L1 copy plus syntax highlight, no runtimes and no sandboxes
    catalogue: 22 records, 20 finished from languages.md second edition plus PowerShell
    tiers: Core 8 (Scratch, HTML, CSS, JavaScript, Python, SQL, Java, TypeScript) and Extended 14
    glossary: this site owns the language terms; other sites link to #/glossary/<term-id>
    i18n: switcher ships, chrome strings bilingual, record prose English in v1, no machine translation
    difficulty_notes: agent drafts for Core 8 only, owner signs each before M3, Extended shows none
    highlighting: hand-rolled ~250-line tokenizer, escape then wrap, no external library
    v1_scope: compare view and "I am not sure" chooser deferred to v1.1
    routing: hash router, one index.html, static index fallback for crawlers
    review_cadence: Core 8 as one pass, then Extended in 3 batches
    cross_links: only where the sibling target exists at build time
    git_shape: one PR per milestone (M0+M1, M2, M3, M4, M5+M6)
    visual_system: ink-on-paper, own tokens.css, divorced from localai, codewithai, and root theme
    text_face: serif system stack, zero font requests
    blueprint_file: tools/build/languages-blueprint.md ruled not a spec and deleted
  open:
