<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Bench</title>
<meta name="description" content="A set of tools for people making tabletop games.">
<meta name="theme-color" content="#2a6a48">
<link rel="stylesheet" href="bench.css">
<script>
  // Apply the saved theme before first paint so there is no flash.
  (function(){try{var t=JSON.parse(localStorage.getItem('gamebench.v1')||'{}');t=t.prefs&&t.prefs.theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
</head>
<body>

<header class="bench-head">
  <a class="brand" href="#" aria-label="Game Bench home">
    <span class="brand-name">Game<span>Bench</span></span>
  </a>
  <div class="head-tools">
    <button class="btn ghost sm" id="btn-theme" type="button" aria-label="Toggle light or dark">Dark</button>
    <details class="menu">
      <summary class="btn ghost sm" aria-label="Your data">Data</summary>
      <div class="menu-list">
        <button type="button" id="btn-export">Download everything (JSON)</button>
        <button type="button" id="btn-import">Load a saved file</button>
        <button type="button" id="btn-clear" class="danger">Clear the bench</button>
        <input type="file" id="import-file" accept="application/json" hidden>
      </div>
    </details>
  </div>
</header>

<nav class="bench-nav" id="bench-nav" aria-label="Tools"></nav>

<main class="bench-main" id="bench-main"></main>

<footer class="bench-foot">
  <span>Game Bench is part of <a href="/fun/">contrapaul / make</a>.</span>
  <span>Everything you enter stays in this browser. Use <b>Data</b> to move it.</span>
</footer>

<script src="bench.js"></script>
<script src="dicemath.js"></script>
<script src="tools/dice.js"></script>
<script src="tools/odds.js"></script>
<script src="tools/deck.js"></script>
<script src="tools/manifest.js"></script>
<script src="tools/setup.js"></script>
<script src="tools/session.js"></script>
<script src="tools/playtest.js"></script>
<script src="data/cards.js"></script>
<script src="tools/cards.js"></script>
<script src="tools/sheet.js"></script>
<script src="tools/checks.js"></script>
<script src="tools/rules.js"></script>
<script src="data/demos.js"></script>
<script src="tools/simplify.js"></script>
<script src="tools/roles.js"></script>
<script src="tools/box.js"></script>
<script src="tools/extras.js"></script>
<script>Bench.start();</script>
</body>
</html>
